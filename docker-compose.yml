# MANARA — Docker Compose (Staging)
#
# Staging-ready configuration with PostgreSQL + pgvector.
#
# Usage:
#   1. Copy .env.example to .env and edit values
#   2. docker compose up -d
#   3. docker compose exec backend alembic upgrade head
#   4. curl -X POST http://localhost:8000/registry/capabilities/seed
#
# Access:
#   Frontend: http://localhost:5173
#   Backend:  http://localhost:8000
#   API Docs: http://localhost:8000/docs

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_STAGING}
      POSTGRES_DB: ${POSTGRES_DB:-manara}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manara} -d ${POSTGRES_DB:-manara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MANARA_ENV: ${MANARA_ENV:-staging}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-manara}:${POSTGRES_PASSWORD:-CHANGE_ME_IN_STAGING}@postgres:5432/${POSTGRES_DB:-manara}
      MANARA_DISCOVERY_MODE: ${MANARA_DISCOVERY_MODE:-synthetic}
      MANARA_SINGLE_TENANT_DEMO: ${MANARA_SINGLE_TENANT_DEMO:-true}
      MANARA_DEFAULT_TENANT_ID: ${MANARA_DEFAULT_TENANT_ID:-tenant_demo}
      SENTENCE_TRANSFORMERS_HOME: /app/.models
      HF_HOME: /app/.models/hf_cache
      MANARA_ZAI_API_KEY: ${MANARA_ZAI_API_KEY:-}
      MANARA_OPENALEX_API_KEY: ${MANARA_OPENALEX_API_KEY:-}
      MANARA_OBJECT_STORE: ${MANARA_OBJECT_STORE:-local}
      MANARA_S3_BUCKET: ${MANARA_S3_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - snapshots:/app/var/snapshots
      - models:/app/.models
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn manara.app:create_app --factory --host 0.0.0.0 --port 8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  snapshots:
  models:
