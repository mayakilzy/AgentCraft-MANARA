# MANARA — Docker Compose (Staging)
#
# Staging-ready configuration with PostgreSQL + pgvector.
# Usage:
#   docker compose up -d
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python -c "
#     from manara.registry import SEED_CAPABILITIES, CapabilityRegistry
#     from manara.db.session import get_session_factory
#     SessionLocal = get_session_factory()
#     with SessionLocal() as db:
#         reg = CapabilityRegistry(db)
#         for cap in SEED_CAPABILITIES:
#             try: reg.create_capability(cap, tenant_id='tenant_demo')
#             except: pass
#   "
#
# Access:
#   Frontend: http://localhost:5173
#   Backend:  http://localhost:8000
#   API Docs: http://localhost:8000/docs

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: manara
      POSTGRES_PASSWORD: CHANGE_ME_IN_STAGING
      POSTGRES_DB: manara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manara -d manara"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MANARA_ENV: staging
      DATABASE_URL: postgresql+psycopg://manara:CHANGE_ME_IN_STAGING@postgres:5432/manara
      MANARA_DISCOVERY_MODE: synthetic
      MANARA_SINGLE_TENANT_DEMO: "true"
      MANARA_DEFAULT_TENANT_ID: tenant_demo
      SENTENCE_TRANSFORMERS_HOME: /app/.models
      HF_HOME: /app/.models/hf_cache
      # Uncomment for live LLM:
      # MANARA_ZAI_API_KEY: your-key-here
      # Uncomment for reliable OpenAlex search:
      # MANARA_OPENALEX_API_KEY: your-key-here
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - snapshots:/app/var/snapshots
      - models:/app/.models
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn manara.app:create_app --factory --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  snapshots:
  models:
