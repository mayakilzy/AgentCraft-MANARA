[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manara"
version = "0.1.0"
description = "MANARA — Adaptive Intelligence Factory (G00 engineering foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD-by-owner" }
authors = [
    { name = "MANARA Project — Owner: Ayman; Implementer: GLM" }
]
keywords = ["manara", "intelligence", "research", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]

dependencies = [
    # Web framework — AADS-recommended default
    "fastapi>=0.115.0,<0.117",
    "uvicorn[standard]>=0.32.0,<0.36",
    # Pydantic v2 — authoritative contract schemas
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "email-validator>=2.2,<3",
    # Database — SQLAlchemy 2.x; Postgres driver optional (psycopg in docker)
    "SQLAlchemy>=2.0.36,<3",
    "alembic>=1.14.0,<2",
    # HTTP / utilities
    "httpx>=0.27,<0.29",
    "python-multipart>=0.0.12,<0.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    # Lint / typecheck / format
    "ruff>=0.7.0,<0.9",
    "mypy>=1.13,<2",
    # Testing
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24,<0.27",
    "pytest-cov>=5.0,<7",
    "coverage[toml]>=7.6,<8",
    # Live API inspection
    "ipython>=8.28,<9",
]

[project.scripts]
manara-migrate = "manara.cli:migrate"
manara-dev = "manara.cli:dev"
manara-test = "manara.cli:test"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"manara" = ["py.typed"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # bandit (security — but tuned below)
    "TID",  # tidy imports
]
ignore = [
    "E501",  # line-too-long: handled by formatter
    "B008",  # do not perform function call in argument defaults (FastAPI Depends pattern)
    "S101",  # use of assert in tests is fine
    "S104",  # 0.0.0.0 binding is intentional for the container
    "S603",  # subprocess calls — we use it only in CLI helpers with explicit args
    "S607",  # partial path in subprocess — acceptable for `manara-dev` shim
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "S101"]
"tests/conftest.py" = ["S"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = ["alembic/versions/.*\\.py", "build/.*", "dist/.*"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --showlocals"
markers = [
    "contract: contract / schema validation tests",
    "smoke: end-to-end API smoke tests",
    "error: error-envelope tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["src/manara"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
